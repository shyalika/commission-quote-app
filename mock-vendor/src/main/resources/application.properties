spring.application.name=mock-vendor
server.port=8081
management.endpoints.web.exposure.include=health

# Required. The app refuses to start without it.
vendor.api-key=${VENDOR_API_KEY:}
vendor.idempotency-ttl=1h

vendor.simulation.enabled=true
vendor.simulation.failure-rate=0.2
vendor.simulation.slow-rate=0.1
vendor.simulation.slow-delay=7s

# Strict JSON, matching docs/vendor-openapi.yaml.
# Unknown fields are rejected (additionalProperties: false).
spring.jackson.deserialization.fail-on-unknown-properties=true
# 12.5 is not a valid loanTermInMonths.
spring.jackson.deserialization.accept-float-as-int=false
# "500000" is not a valid loanAmount.
spring.jackson.mapper.allow-coercion-of-scalars=false
# Write 3750.00, never 3.75E+3.
spring.jackson.write.write-bigdecimal-as-plain=true
