spring.application.name=bff
server.port=8080
management.endpoints.web.exposure.include=health

# Requests run on virtual threads, so blocking vendor calls don't tie up platform threads.
spring.threads.virtual.enabled=true

# Required. The app refuses to start without them.
vendor.base-url=${VENDOR_BASE_URL:}
vendor.api-key=${VENDOR_API_KEY:}

# Correlation ID on every log line (set by CorrelationIdFilter).
# The escape at the end is a space (editors can't trim it); it keeps the ID apart from the logger name.
logging.pattern.correlation=[%X{correlationId:-}]\u0020

# Strict JSON: "500000" is not a number and 12.5 is not a whole number.
spring.jackson.mapper.allow-coercion-of-scalars=false
spring.jackson.deserialization.accept-float-as-int=false
# Write 3750.00, never 3.75E+3.
spring.jackson.write.write-bigdecimal-as-plain=true
